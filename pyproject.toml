[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idemflow"
version = "0.1.0"
description = "Self-diagnosing dead-letter queues: retry-signature cause classification (transient/poison/infra) with auto-remediation for event-driven workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman", email = "habib.gcuf.edu@gmail.com" }]
keywords = ["dead-letter-queue", "workflow", "idempotency", "retry", "event-driven", "agents"]
dependencies = ["scikit-learn>=1.3", "numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/idemflow"
Repository = "https://github.com/habib-analyst/idemflow"

[tool.setuptools.packages.find]
where = ["src"]
